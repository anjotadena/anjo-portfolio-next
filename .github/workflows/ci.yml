name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://anjotadena.dev

jobs:
  quality:
    name: Type check · Lint · Content · Unit · Integration · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Secrets scan
        run: npm run check:secrets
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Content validation
        run: npm run content:validate
      - name: Knowledge index freshness (fails if data/knowledge-index.json is stale)
        run: npm run content:index -- --check
      - name: Unit + integration + component tests
        run: npm test
      - name: RAG evaluation (offline)
        run: npm run eval
      - name: Build
        run: npx next build
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: anjo-portfolio:ci
          build-args: NEXT_PUBLIC_SITE_URL=https://anjotadena.dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name portfolio -p 3000:3000 -e NEXT_PUBLIC_SITE_URL=https://anjotadena.dev anjo-portfolio:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs portfolio
          exit 1
